# Конфиг линтера и тестов. Пакетом репозиторий не является — сборки здесь нет,
# только скрипты, поэтому ни [project], ни [build-system] не нужны.

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# Игнорируется только то, что отражает сознательный стиль кодовой базы:
#   E401 — `import re, os, csv, glob` в одну строку;
#   E701/E702 — компактные однострочники в sign_bank.py и sign_izjava.py (`a=1; b=2`),
#              переписывать их значит переворошить код, который подписывает документы,
#              без выигрыша в читаемости.
# Всё остальное (F, B, UP, E501, E741) должно быть зелёным без исключений.
ignore = ["E401", "E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
# Скрипты лежат в scripts/ и импортируют друг друга по имени (`import reqs`),
# поэтому корень импорта — сама папка scripts.
pythonpath = ["scripts"]
addopts = "-q"
